<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AFANARKA CELL - Pulsa & Paket Data</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand">AFANARKA <span>CELL</span></div>
    <p>Pulsa cepat, mudah, dan terpercaya</p>
  </header>

  <main>
    <section class="card">
      <h1>🛒 Beli Pulsa</h1>

      <label for="operator">Pilih Operator</label>
      <select id="operator">
        <option value="">-- Pilih Operator --</option>
        <option>Telkomsel</option>
        <option>Indosat</option>
        <option>XL</option>
        <option>Tri</option>
        <option>Axis</option>
        <option>Smartfren</option>
      </select>

      <label for="nomor">Nomor HP</label>
      <input id="nomor" type="tel" placeholder="08xxxxxxxxxx">

      <label for="nominal">Nominal Pulsa</label>
      <select id="nominal">
        <option value="">-- Pilih Nominal --</option>
        <option value="7000">Pulsa 5.000 — Rp7.000</option>
        <option value="12000">Pulsa 10.000 — Rp12.000</option>
        <option value="17000">Pulsa 15.000 — Rp17.000</option>
        <option value="22000">Pulsa 20.000 — Rp22.000</option>
        <option value="27000">Pulsa 25.000 — Rp27.000</option>
        <option value="32000">Pulsa 30.000 — Rp32.000</option>
        <option value="37000">Pulsa 35.000 — Rp37.000</option>
        <option value="42000">Pulsa 40.000 — Rp42.000</option>
        <option value="52000">Pulsa 50.000 — Rp52.000</option>
        <option value="102000">Pulsa 100.000 — Rp102.000</option>
      </select>

      <button onclick="pesan()">Pesan Sekarang</button>
      <p class="note">Setelah pesan, Anda akan diarahkan ke WhatsApp untuk konfirmasi pembayaran.</p>
    </section>
  </main>

  <footer>© 2026 AFANARKA CELL</footer>
  <script src="app.js"></script>
</body>
</html>
